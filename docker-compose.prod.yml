services:
  app:
    image: ${ECR_REPO_WITH_TAG:-hamtech-backend:latest}
    container_name: hamtech-backend-prod
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes: []
    depends_on:
      - redis
      - kafka
      - elasticsearch
    restart: unless-stopped
    networks:
      - hamtech-network

  nginx:
    image: nginx:1.25-alpine
    container_name: hamtech-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - hamtech-network

  redis:
    image: redis:7-alpine
    container_name: hamtech-redis-prod
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - hamtech-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hamtech-zookeeper-prod
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    networks:
      - hamtech-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hamtech-kafka-prod
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - hamtech-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hamtech-elasticsearch-prod
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - 'ES_JAVA_OPTS=-Xms256m -Xmx256m'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - hamtech-network

volumes:
  redis-data:
  es-data:

networks:
  hamtech-network:
    driver: bridge
