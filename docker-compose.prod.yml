version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zalogram-backend-prod
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes: []
    depends_on:
      - redis
      - kafka
      - elasticsearch
    restart: unless-stopped
    networks:
      - zalogram-network

  nginx:
    image: nginx:1.25-alpine
    container_name: zalogram-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - zalogram-network

  redis:
    image: redis:7-alpine
    container_name: zalogram-redis-prod
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zalogram-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zalogram-zookeeper-prod
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    networks:
      - zalogram-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: zalogram-kafka-prod
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - zalogram-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: zalogram-elasticsearch-prod
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - zalogram-network

volumes:
  redis-data:
  es-data:

networks:
  zalogram-network:
    driver: bridge
