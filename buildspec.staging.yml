version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: hamtech-backend
    IMAGE_TAG: staging-latest
    RUN_DB_SETUP: 'true'
    RUN_ES_SYNC: 'false'
    DYNAMODB_TABLE_PREFIX: Hamtech_Staging_

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm ci

  pre_build:
    commands:
      - echo "Running checks for staging"
      - npm run lint || echo "Lint errors found, skip fail on staging"
      - npm run typecheck
      - npm test || echo "Tests failed, skip fail on staging"
      - |
        if [ "${RUN_DB_SETUP}" = "true" ]; then
          echo "Running DynamoDB setup for staging"
          export DYNAMODB_ENDPOINT=""
          npm run db:setup
        else
          echo "Skipping DynamoDB setup (RUN_DB_SETUP=${RUN_DB_SETUP})"
        fi
      - |
        if [ "${RUN_ES_SYNC}" = "true" ]; then
          if [ -n "${ELASTICSEARCH_NODE:-}" ]; then
            echo "Waiting for Elasticsearch and syncing users index"
            if npm run es:wait; then
              npm run es:sync:users
            else
              echo "Elasticsearch is unreachable from CodeBuild, skipping users sync"
            fi
          else
            echo "Skipping Elasticsearch sync because ELASTICSEARCH_NODE is not set"
          fi
        else
          echo "Skipping Elasticsearch sync (RUN_ES_SYNC=${RUN_ES_SYNC})"
        fi

      - echo "Logging in to Docker Hub"
      - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - echo "Logging in to Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=${AWS_DEFAULT_REGION}
      - ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
      - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} .
      - docker tag ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} ${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - docker tag ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} ${ECR_URI}:${IMAGE_TAG}

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - |
        if docker image inspect ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} > /dev/null 2>&1; then
          docker push ${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}
          docker push ${ECR_URI}:${IMAGE_TAG}
          printf '{"ImageURI":"%s"}' ${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION} > imageDetail.json
        else
          echo "Build image not found, skipping push"
          exit 1
        fi

artifacts:
  files:
    - appspec.yml
    - scripts/codedeploy/**/*
    - docker-compose.prod.yml
    - nginx/**/*
    - imageDetail.json
